name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Read and validate version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected format: vX.Y.Z, for example v0.2.1"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Build Home Assistant package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist/custom_components
          cp -a custom_components/yt_dlp dist/custom_components/yt_dlp

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("dist/custom_components/yt_dlp/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = os.environ["VERSION"]
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"manifest version: {manifest['version']}")
          PY

          (
            cd dist
            zip -r -9 ../yt_dlp.zip custom_components/yt_dlp \
              -x "*/__pycache__/*" \
                 "*.pyc" \
                 "*.pyo" \
                 "*.DS_Store"
          )

      - name: Verify release package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          unzip -t yt_dlp.zip

          test "$(unzip -Z1 yt_dlp.zip | head -n 1)" != ""
          unzip -Z1 yt_dlp.zip | grep -q '^custom_components/yt_dlp/manifest.json$'

          PACKAGE_VERSION="$(unzip -p yt_dlp.zip custom_components/yt_dlp/manifest.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"

          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "Package version mismatch: expected $VERSION, got $PACKAGE_VERSION"
            exit 1
          fi

          if unzip -Z1 yt_dlp.zip | grep -Ev '^custom_components/yt_dlp(/|$)' | grep -q .; then
            echo "Unexpected files found outside custom_components/yt_dlp"
            unzip -Z1 yt_dlp.zip
            exit 1
          fi

          echo "Package verified successfully: yt_dlp.zip ($VERSION)"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" yt_dlp.zip \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
