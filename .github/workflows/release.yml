name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.2.5"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          VERSION="${TAG#v}"
          if [[ "$TAG" == "$VERSION" || ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Use vX.Y.Z, for example v0.2.5"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag and manifest version
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git rev-parse --verify "refs/tags/$TAG" >/dev/null
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("custom_components/yt_dlp/manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          expected = os.environ["VERSION"]
          actual = str(manifest.get("version", ""))
          if actual != expected:
              raise SystemExit(
                  f"manifest.json version {actual!r} does not match tag version {expected!r}. "
                  f"Run ./scripts/release.sh v{expected} to create releases safely."
              )

          expected_order = [
              "domain",
              "name",
              *sorted(key for key in manifest if key not in {"domain", "name"}),
          ]
          if list(manifest) != expected_order:
              raise SystemExit("manifest.json keys must be domain, name, then alphabetical")
          print(f"Release source version verified: {actual}")
          PY

      - name: Compile Python
        run: python3 -m compileall -q custom_components/yt_dlp

      - name: Validate repository files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml

          root = Path("custom_components/yt_dlp")
          for path in root.rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          yaml.safe_load((root / "services.yaml").read_text(encoding="utf-8"))

          hacs = json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          expected_hacs = {"name": "Youtube DLP", "render_readme": True}
          if hacs != expected_hacs:
              raise SystemExit(f"Unexpected hacs.json content: {hacs!r}")

          if (root / "strings.json").exists():
              raise SystemExit("Custom integrations must use translations/en.json, not strings.json")
          if not (root / "translations/en.json").is_file():
              raise SystemExit("translations/en.json is required")
          if not (root / "brand/icon.png").is_file():
              raise SystemExit("brand/icon.png is required")
          PY

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; nothing to create."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
