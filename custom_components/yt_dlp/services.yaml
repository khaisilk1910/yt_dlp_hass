get_job:
  fields:
    job_id:
      required: true
      selector:
        text:

search:
  fields:
    query:
      required: true
      selector:
        text:
    limit:
      default: 10
      selector:
        number:
          min: 1
          max: 50
          step: 1
          mode: box

play:
  fields:
    url:
      required: true
      selector:
        text:
          type: url
    media_player:
      required: true
      selector:
        entity:
          domain: media_player
          multiple: false

scan_library:
  fields:
    force:
      default: false
      selector:
        boolean:


